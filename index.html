<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174d35"><link rel="manifest" href="/manifest.webmanifest"><title>Giongio Gest</title>
<style>
:root{--g:#174d35;--g2:#e8f1e8;--bg:#f5f7f2;--line:#e0e7dd;--muted:#718073}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1b2d21;font:15px system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 17px;display:flex;justify-content:space-between;align-items:center;z-index:2}.brand{font-size:20px;font-weight:800;color:var(--g)}.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 13px;font-weight:700}.primary{background:var(--g);color:white}.secondary{background:var(--g2);color:var(--g)}.page{padding:20px 15px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#6b886e;font-weight:800;margin:0 0 5px}h1{font-size:28px;margin:0 0 6px;letter-spacing:-.8px}h2{font-size:17px;margin:24px 0 12px}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat,.card,.client,.ledger,.empty,.backup{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.stat span{display:block;font-size:11px;color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:5px;overflow-wrap:anywhere}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{text-align:left;background:#fff;border:1px solid var(--line);color:var(--g);padding:15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:7px 3px max(7px,env(safe-area-inset-bottom));z-index:4}.nav button{background:transparent;color:#7d8a7f;font-size:10px;padding:5px 3px;flex:1}.nav button.active{color:var(--g);background:var(--g2)}.nav span{display:block;margin-top:3px}.heading{display:flex;justify-content:space-between;align-items:center;gap:8px}.heading h1{font-size:26px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:12px}.list{display:grid;gap:10px}.card h3{margin:10px 0 6px;font-size:16px}.meta{font-size:12px;color:var(--muted);margin:5px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #edf0eb;font-size:12px}.pill{display:inline-block;background:var(--g2);color:var(--g);font-size:10px;font-weight:800;border-radius:7px;padding:5px 8px}.field{display:block;margin:12px 0}.field span{display:block;font-size:12px;font-weight:700;color:#536457;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9e2d7;border-radius:10px;background:#fff}.modal{display:none;position:fixed;inset:0;background:#10201688;z-index:8;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#f8faf6;border-radius:20px 20px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom));width:min(720px,100%);max-height:92dvh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:25px}.negative{color:#b4523d}.positive{color:#247341}.hide{display:none!important}.backup{margin-top:22px}.backup p{font-size:12px;color:var(--muted)}.backup button{margin:4px 5px 0 0}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#183e2b;color:#fff;border-radius:12px;padding:11px 16px;font-size:12px;z-index:10;white-space:nowrap}@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;padding:20px}.sheet{border-radius:20px;max-width:520px}.quick{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand">🌿 Giongio Gest<small>Il tuo lavoro, sotto controllo</small></div><button class="secondary" onclick="backup()">Backup / email</button></header>
<main id="main"></main>
<nav class="nav"><button data-tab="home" class="active" onclick="go('home')">🌿<span>Home</span></button><button data-tab="agenda" onclick="go('agenda')">🗓️<span>Agenda</span></button><button data-tab="clienti" onclick="go('clienti')">👥<span>Clienti</span></button><button data-tab="lavori" onclick="go('lavori')">🧤<span>Lavori</span></button><button data-tab="conti" onclick="go('conti')">€<span>Conti</span></button></nav>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">Chiudi</button></div><div id="modalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);
let data={clients:[],jobs:[],payments:[],expenses:[]},tab='home';
try{const s=localStorage.getItem('giongiogest_v1');if(s)data={...data,...JSON.parse(s)}}catch{}
function save(){localStorage.setItem('giongiogest_v1',JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clientName(id){return data.clients.find(x=>x.id===id)?.name||'Cliente non disponibile'}
function jobName(id){return data.jobs.find(x=>x.id===id)?.title||'Lavoro non disponibile'}
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function render(){let m=$('main');if(tab==='home'){let inc=data.payments.filter(p=>p.date.startsWith(today().slice(0,7))).reduce((a,p)=>a+p.amount,0),cost=data.expenses.filter(e=>e.date.startsWith(today().slice(0,7))).reduce((a,e)=>a+e.amount,0),pending=data.jobs.filter(j=>j.status!=='Completato').length;m.innerHTML=`<section class="page"><p class="eyebrow">PANORAMICA</p><h1>Buon lavoro 🌱</h1><div class="muted">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</div><div class="stats"><div class="stat"><span>Lavori aperti</span><b>${pending}</b></div><div class="stat"><span>Clienti</span><b>${data.clients.length}</b></div><div class="stat"><span>Incassi mese</span><b>${eur(inc)}</b></div><div class="stat"><span>Spese mese</span><b>${eur(cost)}</b></div></div><h2>Accessi rapidi</h2><div class="quick"><button onclick="clientForm()">＋ Nuovo cliente</button><button onclick="jobForm()">＋ Nuovo lavoro</button><button onclick="paymentForm()">＋ Registra incasso</button><button onclick="expenseForm()">＋ Registra spesa</button></div><h2>Prossimi lavori</h2><div class="list">${jobCards(data.jobs.filter(j=>j.status!=='Completato').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3))||'<div class="empty">Non hai lavori aperti. Aggiungi il primo intervento.</div>'}</div><div class="backup"><b>I tuoi dati sono salvati in questo browser</b><p>Esporta un backup regolarmente. Puoi condividere il file dal menu Android e scegliere Gmail. I dati non sono ancora sincronizzati con altri dispositivi.</p><button class="secondary" onclick="backup()">Backup / condividi</button><button class="secondary" onclick="$('restore').click()">Ripristina backup</button><input id="restore" class="hide" type="file" accept=".json,application/json" onchange="restore(this.files[0])"></div></section>`}
else if(tab==='agenda'){let js=[...data.jobs].sort((a,b)=>a.date.localeCompare(b.date));m.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">PIANIFICAZIONE</p><h1>Agenda</h1></div><button class="primary" onclick="jobForm()">＋ Lavoro</button></div><div class="list">${jobCards(js)||'<div class="empty">Agenda vuota: aggiungi un lavoro.</div>'}</div></section>`}
else if(tab==='clienti'){m.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">ANAGRAFICA</p><h1>Clienti</h1></div><button class="primary" onclick="clientForm()">＋ Cliente</button></div><input class="search" placeholder="Cerca cliente..." oninput="filterClients(this.value)"><div id="clientList" class="list">${clientCards(data.clients)}</div></section>`}
else if(tab==='lavori'){m.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">INTERVENTI</p><h1>Lavori</h1></div><button class="primary" onclick="jobForm()">＋ Lavoro</button></div><div class="list">${jobCards([...data.jobs].sort((a,b)=>b.date.localeCompare(a.date)))||'<div class="empty">Nessun lavoro registrato.</div>'}</div></section>`}
else{let inc=data.payments.reduce((a,p)=>a+p.amount,0),cost=data.expenses.reduce((a,e)=>a+e.amount,0);m.innerHTML=`<section class="page"><p class="eyebrow">AMMINISTRAZIONE</p><h1>Incassi e spese</h1><div class="stats"><div class="stat"><span>Incassi totali</span><b>${eur(inc)}</b></div><div class="stat"><span>Spese totali</span><b>${eur(cost)}</b></div><div class="stat"><span>Differenza</span><b>${eur(inc-cost)}</b></div></div><div class="quick"><button onclick="paymentForm()">＋ Incasso</button><button onclick="expenseForm()">＋ Spesa</button></div><h2>Incassi</h2><div class="list">${[...data.payments].reverse().map(p=>`<div class="card"><b>${esc(jobName(p.jobId))}</b><div class="meta">${esc(p.date)} · ${esc(p.method)}</div><div class="row"><strong class="positive">+${eur(p.amount)}</strong><button class="secondary" onclick="del('payments','${p.id}')">Elimina</button></div></div>`).join('')||'<div class="empty">Nessun incasso registrato.</div>'}</div><h2>Spese</h2><div class="list">${[...data.expenses].reverse().map(e=>`<div class="card"><b>${esc(e.description)}</b><div class="meta">${esc(e.date)} · ${esc(e.category)}</div><div class="row"><strong class="negative">−${eur(e.amount)}</strong><button class="secondary" onclick="del('expenses','${e.id}')">Elimina</button></div></div>`).join('')||'<div class="empty">Nessuna spesa registrata.</div>'}</div></section>`}}
function jobCards(js){return js.map(j=>`<article class="card"><div class="heading"><span class="pill">${esc(j.status)}</span><span class="muted">${esc(j.date)}</span></div><h3>${esc(j.title)}</h3><div class="meta">👤 ${esc(clientName(j.clientId))}</div><div class="meta">⏱ ${Number(j.hours)||0} ore previste · ${eur(j.price)}</div>${j.notes?`<div class="meta">${esc(j.notes)}</div>`:''}<div class="row"><span>${(data.payments.filter(p=>p.jobId===j.id).reduce((a,p)=>a+p.amount,0))>=Number(j.price)&&j.price>0?'<span class="positive">Saldo coperto</span>':`<span class="negative">Incassato ${eur(data.payments.filter(p=>p.jobId===j.id).reduce((a,p)=>a+p.amount,0))}</span>`}</span><button class="secondary" onclick="toggleJob('${j.id}')">${j.status==='Completato'?'Riapri':'Completa'}</button></div></article>`).join('')}
function clientCards(cs){return cs.map(c=>`<div class="client"><div class="heading"><b>${esc(c.name)}</b><button class="secondary" onclick="del('clients','${c.id}')">Elimina</button></div>${c.phone?`<div class="meta"><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>`:''}${c.address?`<div class="meta">📍 ${esc(c.address)}</div>`:''}${c.notes?`<div class="meta">${esc(c.notes)}</div>`:''}<div class="meta">${data.jobs.filter(j=>j.clientId===c.id).length} lavori</div></div>`).join('')||'<div class="empty">Aggiungi il primo cliente.</div>'}
function filterClients(q){$('clientList').innerHTML=clientCards(data.clients.filter(c=>(c.name+' '+c.phone+' '+c.address).toLowerCase().includes(q.toLowerCase())))}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
function field(label,name,type='text',placeholder='',required=false){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></label>`}
function clientForm(){openModal('Nuovo cliente',`<form onsubmit="saveClient(event)">${field('Nome cliente *','name','text','Es. Mario Rossi',true)}${field('Telefono','phone','tel','Numero di telefono')}${field('Indirizzo','address','text','Via e città')}<label class="field"><span>Note sul giardino</span><textarea name="notes" rows="3" placeholder="Accesso, preferenze, piante..."></textarea></label><button class="primary" style="width:100%">Salva cliente</button></form>`)}
function saveClient(e){e.preventDefault();let f=new FormData(e.target);data.clients.push({id:uid(),name:f.get('name').trim(),phone:f.get('phone'),address:f.get('address'),notes:f.get('notes')});save();closeModal();render();toast('Cliente salvato')}
function jobForm(){if(!data.clients.length){alert('Prima aggiungi un cliente.');clientForm();return}openModal('Nuovo lavoro',`<form onsubmit="saveJob(event)">${field('Tipo di lavoro *','title','text','Es. Taglio siepe',true)}<label class="field"><span>Cliente *</span><select name="clientId" required>${data.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><div class="formrow">${field('Data','date','date',today(),true)}<label class="field"><span>Stato</span><select name="status"><option>Programmato</option><option>Da fare</option><option>In corso</option><option>Completato</option></select></label></div><div class="formrow">${field('Prezzo concordato (€)','price','number','0')}${field('Ore previste','hours','number','0')}</div><label class="field"><span>Note</span><textarea name="notes" rows="2"></textarea></label><button class="primary" style="width:100%">Salva lavoro</button></form>`);$('modalBody').querySelector('[name=date]').value=today()}
function saveJob(e){e.preventDefault();let f=new FormData(e.target);data.jobs.push({id:uid(),title:f.get('title').trim(),clientId:f.get('clientId'),date:f.get('date'),status:f.get('status'),price:Number(f.get('price'))||0,hours:Number(f.get('hours'))||0,notes:f.get('notes')});save();closeModal();render();toast('Lavoro salvato')}
function paymentForm(){if(!data.jobs.length){alert('Prima crea un lavoro.');jobForm();return}openModal('Registra incasso',`<form onsubmit="savePayment(event)"><label class="field"><span>Lavoro *</span><select name="jobId">${data.jobs.map(j=>`<option value="${j.id}">${esc(j.title)} — ${esc(clientName(j.clientId))}</option>`).join('')}</select></label>${field('Data','date','date','',true)}${field('Importo (€) *','amount','number','0,00',true)}<label class="field"><span>Metodo</span><select name="method"><option>Bonifico</option><option>Contanti</option><option>POS</option><option>Altro</option></select></label>${field('Note','notes','text','Acconto, saldo...')}<button class="primary" style="width:100%">Registra incasso</button></form>`);$('modalBody').querySelector('[name=date]').value=today();$('modalBody').querySelector('[name=amount]').min='0.01';$('modalBody').querySelector('[name=amount]').step='0.01'}
function savePayment(e){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0)return;data.payments.push({id:uid(),jobId:f.get('jobId'),date:f.get('date'),amount,method:f.get('method'),notes:f.get('notes')});save();closeModal();render();toast('Incasso registrato')}
function expenseForm(){openModal('Registra spesa',`<form onsubmit="saveExpense(event)">${field('Descrizione *','description','text','Es. Carburante, terriccio',true)}<label class="field"><span>Categoria</span><select name="category"><option>Materiali</option><option>Carburante</option><option>Attrezzatura</option><option>Manutenzione mezzi</option><option>Altro</option></select></label>${field('Data','date','date','',true)}${field('Importo (€) *','amount','number','0,00',true)}<button class="primary" style="width:100%">Salva spesa</button></form>`);$('modalBody').querySelector('[name=date]').value=today();$('modalBody').querySelector('[name=amount]').min='0.01';$('modalBody').querySelector('[name=amount]').step='0.01'}
function saveExpense(e){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0)return;data.expenses.push({id:uid(),description:f.get('description').trim(),category:f.get('category'),date:f.get('date'),amount});save();closeModal();render();toast('Spesa salvata')}
function toggleJob(id){let j=data.jobs.find(x=>x.id===id);if(j)j.status=j.status==='Completato'?'Programmato':'Completato';save();render()}
function del(key,id){if(!confirm('Vuoi eliminare questo elemento?'))return;data[key]=data[key].filter(x=>x.id!==id);save();render()}
async function backup(){
  const blob = new Blob([JSON.stringify({app:'Giongio Gest',version:1,exportedAt:new Date().toISOString(),...data},null,2)], {type:'application/json'});
  const filename = 'giongiogest-backup-' + today() + '.json';
  const file = new File([blob], filename, {type:'application/json'});
  // Su Android, se supportato, apre il menu Condividi e permette di scegliere Gmail.
  try {
    if (navigator.canShare && navigator.canShare({files:[file]}) && navigator.share) {
      await navigator.share({title:'Backup Giongio Gest', text:'Backup dei dati di Giongio Gest', files:[file]});
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  // Ripiego: scarica il file JSON per allegarlo manualmente a un'email.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Backup scaricato: allegalo alla tua email');
}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!['clients','jobs','payments','expenses'].every(k=>Array.isArray(d[k])))throw 0;if(confirm('Il ripristino sostituirà i dati attuali. Continuare?')){data=d;save();render();toast('Backup ripristinato')}}catch{alert('Backup non valido')}};r.readAsText(file)}
function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2200)}
render();
</script><script>if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"));</script></body></html>
